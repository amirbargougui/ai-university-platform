{% extends "base_dashboard.html" %}

{% block content %}
<div class="auth-container">
    <h2 style="text-align: center; color: var(--primary); margin-bottom: 30px;">Connexion Université</h2>
    
    {% if form.errors %}
        <div style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
            Identifiants incorrects.
        </div>
    {% endif %}

    <!-- Formulaire de connexion standard Django -->
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn-submit">Se Connecter</button>
    </form>
    
    <div class="auth-links">
        Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire ici</a>
    </div>
</div>

<style>input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }</style>
{% endblock %}
